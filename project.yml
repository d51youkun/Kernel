name: KernelApp
options:
  bundleIdPrefix: com.kernel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

targets:
  KernelApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KernelApp
    resources:
      - path: KernelApp/Assets.xcassets
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kernel.app
        PRODUCT_NAME: Kernel
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: KernelApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: KernelApp/KernelApp.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: KernelApp/Bridge/KernelApp-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Frameworks
          - $(PROJECT_DIR)/Frameworks/llama.xcframework/ios-arm64
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Frameworks/llama.xcframework/ios-arm64/llama.framework/Headers
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu17
        ENABLE_BITCODE: NO
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ALWAYS_SEARCH_USER_PATHS: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
