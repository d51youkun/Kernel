name: KernelApp
options:
  bundleIdPrefix: com.kernel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  KernelApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KernelApp
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kernel.app
        PRODUCT_NAME: Kernel
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: KernelApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KernelApp/KernelApp.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: KernelApp/Bridge/KernelApp-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks/llama.xcframework/ios-arm64/llama.framework/Headers"

schemes:
  KernelApp:
    build:
      targets:
        KernelApp: all
    run:
      config: Debug
    archive:
      config: Release
