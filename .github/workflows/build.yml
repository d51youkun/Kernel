name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  LLAMA_VERSION: b12020

jobs:
  build:
    name: 🔨 Build & Package IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download llama.xcframework
        run: |
          if [ ! -d "Frameworks/llama.xcframework" ]; then
            mkdir -p Frameworks
            curl -fL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-xcframework.zip" \
              -o Frameworks/llama-xcframework.zip
            unzip -q Frameworks/llama-xcframework.zip -d Frameworks/
            # zip の中の llama.xcframework を Frameworks/ 直下にそろえる
            if [ -d "Frameworks/build-apple/llama.xcframework" ]; then
              rm -rf Frameworks/llama.xcframework
              mv Frameworks/build-apple/llama.xcframework Frameworks/
            fi
            rm -rf Frameworks/build-apple Frameworks/llama-xcframework.zip
          fi
          test -d Frameworks/llama.xcframework/ios-arm64 || (echo "xcframework not found" && exit 1)

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build
        run: |
          set -o pipefail
          # Swift マクロをコマンドラインビルドで動かすため
          # macOS プラットフォームのプラグイン dylib を直接ロードする (Xcode 26 対応)
          DEVDIR=$(xcode-select -p)
          MACRO_DIR="${DEVDIR}/Platforms/MacOSX.platform/Developer/usr/lib/swift/host/plugins"
          MACRO_FLAGS=""
          for lib in libSwiftUIMacros libObservationMacros libFoundationMacros libSwiftDataMacros; do
            f="${MACRO_DIR}/${lib}.dylib"
            [ -f "$f" ] && MACRO_FLAGS="${MACRO_FLAGS} -load-plugin-library ${f}"
          done

          xcodebuild build \
            -project KernelApp.xcodeproj \
            -scheme KernelApp \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build/DerivedData \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ${MACRO_FLAGS:+OTHER_SWIFT_FLAGS="$MACRO_FLAGS"} \
            2>&1 | tee build.log

      # 失敗したとき、error の行だけをログ末尾に出す (コピー用)
      - name: Show compile errors
        if: failure()
        run: |
          grep -n "error:" build.log | head -50 || echo "no error lines found"

      - name: Sign & Package IPA
        run: |
          APP="./build/DerivedData/Build/Products/Release-iphoneos/Kernel.app"
          test -d "$APP" || (echo "Kernel.app not found" && exit 1)
          xattr -rc "$APP"
          # ldid で擬似署名 (get-task-allow を保持、sideload 対応)
          brew install ldid
          ldid -S KernelApp/KernelApp.entitlements "$APP/Kernel"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Kernel.ipa Payload/
          rm -rf Payload
          echo "✅ $(du -sh Kernel.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-IPA-${{ github.run_number }}
          path: Kernel.ipa
          if-no-files-found: error
          retention-days: 90

      # YouTubePlus 方式: ビルド成功時に自動で Release に IPA を添付する
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Kernel build #${{ github.run_number }}"
          files: Kernel.ipa
          draft: false
        continue-on-error: true
