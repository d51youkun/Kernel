name: Release IPA
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: swift test
      - run: bash build_ipa.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: Kernel.ipa
          body: |
            Kernel for iPadOS 18+. See README for implemented features and limitations.
            This IPA is ad-hoc signed and requires re-signing and device provisioning.
            JIT requires a compatible device, pairing, VPN, and debug entitlement; not guaranteed.
